services:
  web:
    build: ./docker/web
    container_name: rca_web
    ports:
      - "80:80"
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Build des assets du thème (SCSS, JS) : watch automatique au démarrage.
  # Build de prod : docker compose exec node yarn build
  node:
    image: node:24-alpine
    container_name: rca_node
    working_dir: /app
    environment:
      THEME_DIR: /theme
    volumes:
      - ./docker/node:/app
      - ./wordpress/wp-content/themes/campus_v6:/theme
    command: sh -c "yarn install && yarn dev"

  db:
    image: mysql:8.0
    container_name: rca_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  db_data:
